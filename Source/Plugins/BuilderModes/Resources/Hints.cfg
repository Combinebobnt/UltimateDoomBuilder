class ExtrudeLinedefsMode
group general
"<b>Move the mouse</b> to move the extrusion. Open chains follow the mouse in any direction, keeping new vertices on the grid; hold <b>Ctrl</b> to lock to the line normals. Hold <b>Shift</b> to toggle grid snap"
"Typing a distance or using <k>buildermodes_increasebevel</k> and <k>buildermodes_decreasebevel</k> stops mouse tracking. Positive distances extrude into the void side of one-sided linedefs; negative ones extrude into the sector"
"<b>Click</b> or press <k>builder_acceptmode</k> to accept. The new outer edge stays selected, so extruding again continues it"
"Press <k>builder_cancelmode</k> or <k>builder_classicedit</k> to cancel"

group mod_shift
"Toggles grid snapping"

group mod_ctrl
"Locks the extrusion to the line normals"

group mod_ctrl_shift
"Locks the extrusion to the line normals and toggles grid snapping"


class CurveLinedefsMode
group general
"<b>LMB-drag</b> or use <k>buildermodes_increasebevel</k> and <k>buildermodes_decreasebevel</k> to change curve depth. Hold <b>Shift</b> while dragging to change by 1 map unit" 
"<b>RMB-drag</b> or use <k>buildermodes_rotateclockwise</k> and <k>buildermodes_rotatecounterclockwise</k> to change curve bulginess. Hold <b>Shift</b> while dragging to change by 1 degree"
"<b>LMB+RMB-drag</b> or use <k>buildermodes_increasesubdivlevel</k> and <k>buildermodes_decreasesubdivlevel</k> to change the number of points in the curve"
"When <b>CTRL+ALT+RMB-drag</b> When Fixed Circlar Curve is set, increase/decrease the dividing vertices together with the angle of the curve to maintain a consistent circular curve."
"Press <k>builder_acceptmode</k> to accept"
"Press <k>builder_cancelmode</k> or <k>builder_classicedit</k> to cancel"


