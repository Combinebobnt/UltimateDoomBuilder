// This is used to require zandronum.pk3 when you are working with a Zandronum game configuration.
// Without it, base DECORATE classes and the DOOMDEFS lights don't resolve, so the resource load warns once.

materialengine = "zandronum";

requiredarchives
{
	zandronum
	{
		filename = "zandronum.pk3";
		need_exclude = true;

		0
		{
			class = "actor";
		}

		1
		{
			// zandronum.pk3 has it, gzdoom.pk3 doesn't
			lump = "gamemode.txt";
		}
	}
}
