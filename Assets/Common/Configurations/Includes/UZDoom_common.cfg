// This is used to require GZDoom.pk3 when you are working with a GZDoom game configuration.

// Read filter/<name>/ content of PK3s and directories the way the engine does
lumpfilters = true;
materialengine = "uzdoom";

// Light mode for maps whose MAPINFO sets none (gl_lightmode 1 resolves them to ZDoomSoftware, 8).
// Visual mode models it; configurations without this key keep the editor's own light curve.
defaultlightmode = 8;

requiredarchives
{
	gzdoom
	{
		filename = "uzdoom.pk3";
		need_exclude = true;
		
		0
		{
			// this is currently checked globally for all archives
			class = "actor";
		}
	
		1
		{
			lump = "x11r6rgb.txt";
		}
	}
}
