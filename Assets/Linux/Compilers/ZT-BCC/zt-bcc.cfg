compilers
{
	// Linux uses the system zt-bcc: the /usr/bin/bcc wrapper passes its own lib dir.
	// The file entries are the compiler's own headers, which UDB's include pre-parse skips.
	zt-bcc
	{
		interface = "ZtBccCompiler";
		program = "/usr/bin/bcc";
		zcommon = "zcommon.acs";
		zcommonbcs = "zcommon.bcs";
		zcommonh = "zcommon.h.bcs";
		libbcs = "libbcs.bcs";
		zasm = "zasm.bcs";
		zasmh = "zasm.h.bcs";
	}
}
